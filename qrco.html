<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uyezlux Transportation</title>
  <meta name="description" content="Uyezlux Transportation - Premium private transportation services." />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0b0b0b, #1b1b1b);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #2d2d2d;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      text-align: center;
    }
    .brand {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .tagline {
      color: #d6d6d6;
      margin-bottom: 22px;
      font-size: 15px;
    }
    .name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .role {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 22px;
    }
    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      color: #111;
      background: #fff;
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 14px;
      font-weight: 700;
      transition: .2s ease;
    }
    .btn:hover { transform: translateY(-1px); opacity: .92; }
    .btn.dark {
      background: #222;
      color: #fff;
      border: 1px solid #3a3a3a;
    }
    .services {
      margin-top: 26px;
      text-align: left;
      background: #171717;
      border: 1px solid #2c2c2c;
      border-radius: 16px;
      padding: 18px;
    }
    .services h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    .services ul {
      margin: 0;
      padding-left: 20px;
      color: #d8d8d8;
      line-height: 1.8;
      font-size: 14px;
    }
    .footer {
      margin-top: 22px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Uyezlux Transportation</div>
    <div class="tagline">Premium Private Transportation</div>

    <div class="name">Oslay</div>
    <div class="role">Private Transportation Service</div>

    <a class="btn" href="tel:+13054235119">Call Now</a>
    <a class="btn" href="https://wa.me/13054235119" target="_blank" rel="noopener">WhatsApp</a>
    <a class="btn" href="mailto:uyezlux@gmail.com">Email</a>
    <a class="btn dark" href="https://www.instagram.com/oslaysanchez/" target="_blank" rel="noopener">Instagram</a>

    <section class="services">
      <h2>Services</h2>
      <ul>
        <li>Airport Transfer</li>
        <li>Executive Transportation</li>
        <li>Private Driver</li>
        <li>Cruise Port Transportation</li>
        <li>Hourly Service</li>
      </ul>
    </section>

    <div class="footer">Professional • Reliable • Private</div>
  </main>
</body>
</html>
